name: Patch locked-pick state

on:
  push:
    branches:
      - fix/locked-pick-state-styling
    paths:
      - .github/workflows/patch-locked-pick-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/locked-pick-state-styling
      - name: Patch locked-pick presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              (
                  "note=status.state==='pending'?`Enjoy the games.`:`Next week opens Sunday at 5:00am.`;",
                  "note=status.state==='pending'?`Enjoy the games!`:`Next week opens Sunday at 5:00am.`;",
              ),
              (
                  '<div class="current-pick-banner locked">Current Pick: ${pick?teamDisplay(pick.team):\'—\'}</div>',
                  '<div class="current-pick-banner" style="background:${pick?teamColor(pick.team):\'var(--panel-2)\'}; color:${pick?teamSecondaryColor(pick.team):\'var(--text)\'}; border-color:${pick?teamSecondaryColor(pick.team):\'var(--hair)\'};">Pick Locked: ${pick?teamDisplay(pick.team):\'—\'}</div>',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify change
        shell: bash
        run: |
          grep -F 'Pick Locked:' index.html
          grep -F 'Enjoy the games!' index.html
          grep -F 'background:${pick?teamColor(pick.team)' index.html
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style locked pick state with team colors"
          git push origin HEAD:fix/locked-pick-state-styling
