name: Apply SEC final loser gray

on:
  push:
    branches:
      - ui-sec-final-loser-gray
    paths:
      - .github/workflows/apply-sec-final-loser-gray.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-sec-final-loser-gray
      - name: Patch final losing score color
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = ".game-row:has(.game-team.winner) .game-team:not(.winner){opacity:.55;}"
          new = old + "\n  .game-row:has(.game-team.winner) .game-team:not(.winner) .game-score{color:var(--text-dim);}"
          if new in text:
              raise SystemExit('SEC final loser gray patch already present')
          if old not in text:
              raise SystemExit('Could not find final-score clarity rule')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use gray for SEC final losing scores"
          git push origin HEAD:ui-sec-final-loser-gray
