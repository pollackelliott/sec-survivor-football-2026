name: Update SEC Survivor scores

on:
  # Temporary branch-only push trigger for the preseason production smoke test.
  push:
    branches:
      - fix/score-ingestion-hardening
  # Scheduled score refreshes. Cron is UTC. We intentionally run every day
  # during the game window so weather/reschedule oddities are still covered.
  # 17:00-08:30 UTC reaches well past the end of late Central-time games,
  # including after daylight saving time ends.
  schedule:
    - cron: '*/30 17-23 * * *'
    - cron: '*/30 0-8 * * *'
  # Manual trigger, e.g. to backfill or force a specific week.
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to update (leave blank to auto-detect from today's date)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sec-score-ingestion
  cancel-in-progress: true

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Determine week
        id: week
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ESPN regular-season weeks roll on Monday. Use Chicago local date so
          # a Sunday-night run does not become Monday merely because UTC did.
          WEEK1_MONDAY="2026-08-31"
          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$WEEK1_MONDAY" +%s) ) / 86400 ))

          if [ "$DAYS" -lt 0 ]; then
            WEEK=1
          else
            WEEK=$(( DAYS / 7 + 1 ))
          fi

          # This pool has 13 regular-season weeks. Scheduled jobs after Week 13
          # should not start ingesting championship/postseason games. A manual
          # dispatch can still run any explicitly requested week.
          if [ "$WEEK" -gt 13 ]; then
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "run_scraper=false" >> "$GITHUB_OUTPUT"
            echo "Regular-season pool is complete; scheduled score ingestion skipped."
          else
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            echo "Auto-detected pool week $WEEK from Chicago date $TODAY."
          fi

      - name: Run scraper
        if: steps.week.outputs.run_scraper == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/update_scores.py --week ${{ steps.week.outputs.week }} --year 2026
