name: Patch missed-pick elimination
on:
  push:
    branches: [fix/missed-pick-elimination]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/missed-pick-elimination
      - run: python scripts/patch_missed_pick_elimination.py
      - run: |
          grep -q "!picks\[w\]&&weekDeadline(w+1)" index.html
          git diff --check
      - run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add index.html
          git commit -m "Eliminate missed picks at weekly reveal"
          git push
