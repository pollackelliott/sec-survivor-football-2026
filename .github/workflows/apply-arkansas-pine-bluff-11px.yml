name: Apply Arkansas-Pine Bluff 11px

on:
  push:
    branches:
      - ui-arkansas-pine-bluff-11px
    paths:
      - .github/workflows/apply-arkansas-pine-bluff-11px.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-arkansas-pine-bluff-11px
      - name: Shrink only Arkansas-Pine Bluff in weekly scores
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '''return `<span class="game-team-name ${teamCategoryClass(team)}">${team}</span>`;'''
          new = '''return `<span class="game-team-name ${teamCategoryClass(team)}"${team==='Arkansas-Pine Bluff'?' style="font-size:11px;"':''}>${team}</span>`;'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one nonconference side renderer, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shrink Arkansas-Pine Bluff weekly label"
          git push origin HEAD:ui-arkansas-pine-bluff-11px
