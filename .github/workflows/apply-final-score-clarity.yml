name: Apply final score clarity

on:
  push:
    branches:
      - ui-final-score-clarity
    paths:
      - .github/workflows/apply-final-score-clarity.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-final-score-clarity
      - name: Patch weekly score presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          marker = '/* final-score-clarity */'
          if marker in text:
              raise SystemExit('final-score-clarity already present')
          if '</style>' not in text:
              raise SystemExit('Could not find </style> in index.html')

          css = """
  /* final-score-clarity */
  .game-row:has(.game-team.winner) .game-team:not(.winner){opacity:.55;}
  .game-team.winner .game-score{color:var(--text);font-weight:900;font-size:1.08em;}
  .game-row:has(.game-team.winner) > .game-at + .game-team::after{content:' F';color:var(--text-faint);font-size:10px;font-weight:900;letter-spacing:.05em;margin-left:2px;}
"""
          path.write_text(text.replace('</style>', css + '</style>', 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify final scores and winners"
          git push origin HEAD:ui-final-score-clarity
