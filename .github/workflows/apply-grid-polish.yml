name: Apply grid polish

on:
  push:
    branches:
      - ui-grid-polish-long-names

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              (
                  '.grid-hint{margin:0 0 7px; padding:0 2px; font-size:10px; font-weight:600; color:var(--text-faint); letter-spacing:.015em;}',
                  '.grid-hint{margin:0 0 7px; padding:0 2px; font-size:9px; font-weight:600; color:var(--text-faint); letter-spacing:.015em; text-align:center;}'
              ),
              (
                  'table.grid th.corner{position:sticky; left:0; top:0; z-index:5; background:var(--panel-2); text-align:left;',
                  'table.grid th.corner{position:sticky; left:0; top:0; z-index:5; background:var(--panel-2); text-align:center;'
              ),
              (
                  "(team==='Arkansas-Pine Bluff'||team==='Youngstown State')",
                  "(team==='Arkansas-Pine Bluff'||team==='Youngstown State'||team==='Louisiana-Monroe'||team==='Western Kentucky')"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -Fq 'font-size:9px; font-weight:600; color:var(--text-faint); letter-spacing:.015em; text-align:center;' index.html
          grep -Fq 'background:var(--panel-2); text-align:center;' index.html
          grep -Fq "team==='Louisiana-Monroe'" index.html
          grep -Fq "team==='Western Kentucky'" index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish grid hints and long opponent names'
          git push
