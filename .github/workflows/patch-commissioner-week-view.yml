name: Patch commissioner week view

on:
  push:
    branches:
      - fix/commissioner-week-view
    paths:
      - .github/workflows/patch-commissioner-week-view.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commissioner-week-view
      - name: Patch commissioner display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              (
                  "async function openAdminSheet(){",
                  "function commissionerVisibleWeek(){const now=new Date();let visible=1;for(let w=1;w<WEEKS;w++){const reopen=weekReopenTime(w);if(reopen&&now>=reopen)visible=w+1;else break;}return visible;}async function openAdminSheet(){",
              ),
              (
                  "const rows=data||[],allTeams=CONFERENCE_TEAMS;",
                  "const allTeams=CONFERENCE_TEAMS,visibleWeek=commissionerVisibleWeek(),rows=(data||[]).filter(r=>r.week<=visibleWeek),currentIds=new Set(rows.filter(r=>r.week===visibleWeek).map(r=>r.player_id));ALL_PLAYERS.filter(p=>p.alive&&!currentIds.has(p.id)).forEach(p=>rows.push({player_id:p.id,player_name:p.name,week:visibleWeek,team:null}));rows.sort((a,b)=>b.week-a.week||comparePlayerNames(a.player_name,b.player_name));",
              ),
              (
                  '''${rows.map(r=>`<div class="admin-row"><div class="an">${r.player_name} — Wk ${r.week}</div><select data-pid="${r.player_id}" data-week="${r.week}" class="admin-team-select">${allTeams.map(t=>`<option value="${t}" ${t===r.team?'selected':''}>${t}</option>`).join('')}</select><button class="admin-del" data-pid="${r.player_id}" data-week="${r.week}">Delete</button></div>`).join('')}''',
                  '''${rows.map(r=>`<div class="admin-row"><div class="an">${r.player_name} — Wk ${r.week}</div><select data-pid="${r.player_id}" data-week="${r.week}" class="admin-team-select">${r.team?'':`<option value="" selected disabled>Pick not yet submitted</option>`}${allTeams.map(t=>`<option value="${t}" ${t===r.team?'selected':''}>${t}</option>`).join('')}</select>${r.team?`<button class="admin-del" data-pid="${r.player_id}" data-week="${r.week}">Delete</button>`:''}</div>`).join('')}''',
              ),
              (
                  "if(error)alert(error.message);else await refreshAll();",
                  "if(error)alert(error.message);else{await refreshAll();openAdminSheet();}",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of target; found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify change
        shell: bash
        run: |
          grep -F 'function commissionerVisibleWeek()' index.html
          grep -F 'rows.sort((a,b)=>b.week-a.week||comparePlayerNames' index.html
          grep -F 'Pick not yet submitted' index.html
          grep -F '.filter(r=>r.week<=visibleWeek)' index.html
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve commissioner weekly pick view"
          git push origin HEAD:fix/commissioner-week-view
