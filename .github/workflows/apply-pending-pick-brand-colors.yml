name: Apply pending pick brand colors

on:
  push:
    branches:
      - ui-pending-pick-brand-colors

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          anchor = "function teamSecondaryColor(name){return TEAM_SECONDARY_COLORS[name]||'#F5F7FB';}"
          helper = anchor + "function colorLuminance(hex){const h=hex.replace('#',''),v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2];}function colorContrast(a,b){const x=colorLuminance(a),y=colorLuminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function pendingPickColor(name){const p=teamColor(name),s=teamSecondaryColor(name),bg=getComputedStyle(document.documentElement).getPropertyValue('--panel').trim()||'#000000',pc=colorContrast(p,bg),sc=colorContrast(s,bg);if(pc>=3)return p;if(sc>=3)return s;return 'color-mix(in srgb, '+p+' 55%, white)';}"
          if anchor not in text:
              raise SystemExit('team color helper anchor not found')
          text = text.replace(anchor, helper, 1)

          old = 'else cells+=`<td class="pick neutral" data-week="${wk}" title="${pick}">${teamAbbr(pick)}</td>`;'
          new = 'else cells+=`<td class="pick neutral" data-week="${wk}" title="${pick}" style="color:${pendingPickColor(pick)}">${teamAbbr(pick)}</td>`;'
          if old not in text:
              raise SystemExit('pending pick cell anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -Fq 'function pendingPickColor(name)' index.html
          grep -Fq 'style="color:${pendingPickColor(pick)}"' index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Color pending picks by team brand'
          git push
