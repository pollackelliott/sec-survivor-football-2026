name: Apply SEC hint left align

on:
  push:
    branches:
      - ui-sec-hint-left-align-v2

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '.grid-hint{margin:0 0 7px; padding:0 2px; font-size:9px; font-weight:600; color:var(--text-faint); letter-spacing:.015em; text-align:center;}'
          new = '.grid-hint{margin:0 0 7px; padding:0 2px; font-size:9px; font-weight:600; color:var(--text-faint); letter-spacing:.015em; text-align:left;}'
          if old not in text:
              raise SystemExit('SEC grid hint anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -Fq 'font-size:9px; font-weight:600; color:var(--text-faint); letter-spacing:.015em; text-align:left;' index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Left align SEC grid helper text'
          git push
