name: Patch eliminated player sort
on:
  push:
    branches: [fix/eliminated-sort-by-week]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eliminated-sort-by-week
      - name: Sort eliminated players by elimination week
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function comparePlayers(a,b){if(a.alive!==b.alive)return a.alive?-1:1;return comparePlayerNames(a.name,b.name);}"
          new="function comparePlayers(a,b){if(a.alive!==b.alive)return a.alive?-1:1;if(!a.alive&&!b.alive){const elim=(b.eliminatedWeek||0)-(a.eliminatedWeek||0);if(elim)return elim;}return comparePlayerNames(a.name,b.name);}"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -q "const elim=(b.eliminatedWeek||0)-(a.eliminatedWeek||0)" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add index.html
          git commit -m "Sort eliminated players by elimination week"
          git push
