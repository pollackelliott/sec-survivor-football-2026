name: Apply final marker nowrap

on:
  push:
    branches:
      - ui-final-marker-nowrap
    paths:
      - .github/workflows/apply-final-marker-nowrap.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-final-marker-nowrap
      - name: Keep final marker with score
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old_score = ".game-score{font-family:var(--body); color:var(--gold); font-weight:700; margin-left:4px;}"
          new_score = ".game-score{font-family:var(--body); color:var(--gold); font-weight:700; margin-left:4px; white-space:nowrap;}"
          old_final = ".game-row:has(.game-team.winner) > .game-at + .game-team::after{content:' F';color:var(--text-faint);font-size:10px;font-weight:900;letter-spacing:.05em;margin-left:2px;}"
          new_final = ".game-row:has(.game-team.winner) > .game-at + .game-team .game-score::after{content:' F';color:var(--text-faint);font-size:10px;font-weight:900;letter-spacing:.05em;margin-left:2px;}"
          if text.count(old_score) != 1:
              raise SystemExit(f'Expected exactly one game-score rule, found {text.count(old_score)}')
          if text.count(old_final) != 1:
              raise SystemExit(f'Expected exactly one final-marker rule, found {text.count(old_final)}')
          text = text.replace(old_score, new_score, 1).replace(old_final, new_final, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep final marker with score"
          git push origin HEAD:ui-final-marker-nowrap
