name: Patch commissioner email button
on:
  push:
    branches: [feat/commissioner-copy-reminder-emails]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commissioner-copy-reminder-emails
      - name: Patch commissioner email copy action
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=".admin-del-spacer{width:60px; flex:0 0 60px;}@media (max-width:430px){.admin-row select{width:170px; flex-basis:170px;}.admin-row button,.admin-del-spacer{width:58px; flex-basis:58px;}}"
          new_css=".admin-del-spacer{width:60px; flex:0 0 60px;}.admin-email-tools{display:flex;align-items:center;gap:8px;margin:0 0 14px;}.admin-email-tools .btn{margin:0;flex:1;padding:9px 12px;font-size:12px;}.admin-email-msg{font-size:11px;color:var(--text-faint);min-height:16px;margin-bottom:4px;}@media (max-width:430px){.admin-row select{width:170px; flex-basis:170px;}.admin-row button,.admin-del-spacer{width:58px; flex-basis:58px;}}"
          assert old_css in s
          s=s.replace(old_css,new_css,1)
          old_html="<div class=\"week-section\"><h3>All Picks</h3>${rows.map(r=>"
          new_html="<div class=\"week-section\"><h3>All Picks</h3><div class=\"admin-email-tools\"><button class=\"btn secondary\" id=\"copyReminderEmailsBtn\">Copy Reminder Emails</button></div><div class=\"admin-email-msg\" id=\"adminEmailMsg\"></div>${rows.map(r=>"
          assert old_html in s
          s=s.replace(old_html,new_html,1)
          old_wire="showSheet();document.querySelectorAll('.admin-team-select').forEach"
          new_wire="showSheet();const copyEmailsBtn=document.getElementById('copyReminderEmailsBtn'),emailMsg=document.getElementById('adminEmailMsg');if(copyEmailsBtn)copyEmailsBtn.addEventListener('click',async()=>{copyEmailsBtn.disabled=true;copyEmailsBtn.textContent='Loading…';try{const{data:emailRows,error:emailErr}=await sb.rpc('admin_get_missing_pick_email_list');if(emailErr)throw emailErr;const info=emailRows&&emailRows[0]?emailRows[0]:{week:visibleWeek,player_count:0,emails:''};if(!info.emails){emailMsg.textContent=`Nobody alive owes a Week ${info.week} pick.`;copyEmailsBtn.textContent='Copy Reminder Emails';return;}await navigator.clipboard.writeText(info.emails);emailMsg.textContent=`Copied ${info.player_count} Week ${info.week} email${Number(info.player_count)===1?'':'s'} to clipboard.`;copyEmailsBtn.textContent=`Copied ${info.player_count} Emails`;setTimeout(()=>{copyEmailsBtn.textContent='Copy Reminder Emails';},1800);}catch(err){emailMsg.textContent='Could not copy emails: '+(err.message||err);copyEmailsBtn.textContent='Copy Reminder Emails';}finally{copyEmailsBtn.disabled=false;}});document.querySelectorAll('.admin-team-select').forEach"
          assert old_wire in s
          s=s.replace(old_wire,new_wire,1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -q "admin_get_missing_pick_email_list" index.html
          grep -q "Copy Reminder Emails" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add index.html
          git commit -m "Add commissioner reminder email copy button"
          git push