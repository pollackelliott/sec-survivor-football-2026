name: Patch Tennessee secondary white
on:
  push:
    branches: [fix/tennessee-secondary-white]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tennessee-secondary-white
      - name: Force Tennessee approved secondary color
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function pendingPickStyle(name){const bg=teamColor(name),preferred=teamSecondaryColor(name),preferredContrast=colorContrast(preferred,bg),whiteContrast=colorContrast('#FFFFFF',bg),blackContrast=colorContrast('#000000',bg);let fg=preferred;if(preferredContrast<3)fg=whiteContrast>=blackContrast?'#FFFFFF':'#000000';return `background:${bg};color:${fg};`;}"
          new="function pendingPickStyle(name){const bg=teamColor(name),preferred=teamSecondaryColor(name),preferredContrast=colorContrast(preferred,bg),whiteContrast=colorContrast('#FFFFFF',bg),blackContrast=colorContrast('#000000',bg);let fg=preferred;if(name!=='Tennessee'&&preferredContrast<3)fg=whiteContrast>=blackContrast?'#FFFFFF':'#000000';return `background:${bg};color:${fg};`;}"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -q "name!=='Tennessee'&&preferredContrast<3" index.html
          grep -q "'Tennessee':'#FFFFFF'" index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "Elliott Pollack"
          git config user.email "pollack.elliott@gmail.com"
          git add index.html
          git commit -m "Keep Tennessee secondary color white"
          git push
