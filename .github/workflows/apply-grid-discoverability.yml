name: Apply grid discoverability

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch grid affordance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          css_anchor = '  .grid-wrap{'
          css = '''  .grid-hint{margin:0 0 7px; padding:0 2px; font-size:10px; font-weight:600; color:var(--text-faint); letter-spacing:.015em;}\n  table.grid th.wk-head,table.grid td.pick,table.grid td.name-cell{cursor:pointer; transition:box-shadow .12s ease;}\n  table.grid th.wk-head:active,table.grid td.pick:active,table.grid td.name-cell:active{box-shadow:inset 0 0 0 999px rgba(255,255,255,.06);}\n  @media (hover:hover) and (pointer:fine){table.grid th.wk-head:hover,table.grid td.pick:hover,table.grid td.name-cell:hover{box-shadow:inset 0 0 0 999px rgba(255,255,255,.045);}}\n'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css + css_anchor, 1)

          old = "document.getElementById('view-grid').innerHTML=ordered.length?`<div class=\"grid-wrap\">"
          new = "document.getElementById('view-grid').innerHTML=ordered.length?`<div class=\"grid-hint\">Tap any player, week, or pick for details</div><div class=\"grid-wrap\">"
          if old not in text:
              raise SystemExit('renderGrid anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -Fq 'Tap any player, week, or pick for details' index.html
          grep -Fq '.grid-hint{' index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add subtle grid detail affordance'
          git push
